<div class="call-logs-container">

  <h2 class="call-logs-title">
    📞 Call Logs
  </h2>

  <div class="call-logs-card">

    <table mat-table [dataSource]="dataSource" class="call-logs-table">

      <!-- User -->
      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let row">{{ row.userName }}</td>
      </ng-container>

      <!-- Lead -->
      <ng-container matColumnDef="leadName">
        <th mat-header-cell *matHeaderCellDef>Lead</th>
        <td mat-cell *matCellDef="let row">{{ row.leadName }}</td>
      </ng-container>

      <!-- Phone -->
      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let row">{{ row.phoneNumber }}</td>
      </ng-container>

      <!-- Type -->
      <ng-container matColumnDef="callType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let row">{{ row.callType }}</td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="callStatus">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">
          <span
            class="status-pill"
            [ngClass]="row.callStatus.toLowerCase()"
          >
            {{ row.callStatus }}
          </span>
        </td>
      </ng-container>

      <!-- Duration -->
      <ng-container matColumnDef="callDuration">
        <th mat-header-cell *matHeaderCellDef>Duration</th>
        <td mat-cell *matCellDef="let row">{{ row.callDuration }}</td>
      </ng-container>

      <!-- Call Time -->
      <ng-container matColumnDef="callTime">
        <th mat-header-cell *matHeaderCellDef>Call Time</th>
        <td mat-cell *matCellDef="let row">{{ row.callTime }}</td>
      </ng-container>

      <!-- Remarks -->
      <ng-container matColumnDef="remarks">
        <th mat-header-cell *matHeaderCellDef>Remarks</th>
        <td mat-cell *matCellDef="let row">{{ row.remarks }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

  </div>
</div>
