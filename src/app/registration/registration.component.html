<div class="registration-container">
  <h2>User Registration</h2>

  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" placeholder="Enter username" />
        <mat-error *ngIf="f['username'].touched && f['username'].invalid">
          Username is required (min 3 characters)
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Phone Number</mat-label>
        <input matInput formControlName="phone" placeholder="Enter phone number" />
        <mat-error *ngIf="f['phone'].touched && f['phone'].invalid">
          Enter valid 10-digit phone number
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="Enter email" />
        <mat-error *ngIf="f['email'].touched && f['email'].invalid">
          Enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</mat-option>
        </mat-select>
        <mat-error *ngIf="f['role'].touched && f['role'].invalid">
          Role is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <button mat-flat-button color="primary" type="submit" class="submit-button" [disabled]="registrationForm.invalid">
        Register
      </button>
    </div>

  </form>
</div>
